services:
  nocamera-news:
    build: .
    container_name: nocamera-news
    ports:
      - "3010:3000"
    volumes:
      # Mount db.json to persist search keywords, settings, and match history
      - ./db.json:/app/db.json
      # Mount seen_ids.json to persist daily scraper track list
      - ./seen_ids.json:/app/seen_ids.json
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
